version = 1

[[annotations]]
path = ["**/*.c", "**/*.cpp", "**/*.h", "**/*.hpp", "**/*.py", "**/*.sh", "**/*.pbs", "**/*.lean", "**/Makefile", "**/*.mk", "**/*.toml", "**/*.cu"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Charles Gretton"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**/*.tex", "**/*.pdf", "**/*.md", "**/*.bib", "**/*.json", "**/*.jsonl", "**/*.txt", "**/*.csv", "**/*.log"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Charles Gretton"
SPDX-License-Identifier = "CC-BY-4.0"

# Metadata and documentation without a recognised extension
[[annotations]]
path = ["**/*.sha256", "VERSION", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Charles Gretton"
SPDX-License-Identifier = "CC-BY-4.0"

# Build configuration
[[annotations]]
path = ["**/lean-toolchain"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Charles Gretton"
SPDX-License-Identifier = "Apache-2.0"

# Compressed result data and run logs
[[annotations]]
path = ["**/*_results.tar.gz", "rung/results/*.tar.gz", "**/*.log.gz"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Charles Gretton"
SPDX-License-Identifier = "CC-BY-4.0"

# Archives holding both code and data: campaign bundles and the independent workstream's archives
[[annotations]]
path = ["mining/independent/*.gz", "symmetric/z1/closed_cells/*_bundle.tar.gz", "symmetric/z1/closed_cells/*_release.tar.gz"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Charles Gretton"
SPDX-License-Identifier = "Apache-2.0 AND CC-BY-4.0"
